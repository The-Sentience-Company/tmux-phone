<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="tmux">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="version" content="{{VERSION}}">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>tmux</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root {
    --bg: #000; --fg: #d0d0d0; --dim: #767676; --line: #303030;
    --green: #5fd75f; --red: #ff5f5f; --yellow: #d7d75f; --cyan: #5fd7d7;
    --font: Menlo, ui-monospace, "SF Mono", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); }
  /* The views fill the body, which is pinned to what is visible, so the key bar sits right on the keyboard. */
  body { position: fixed; left: 0; right: 0; top: var(--vtop, 0); height: var(--vh, 100dvh); overflow: hidden; }
  /* Header buttons read as [Label]. Pressed or armed shows in reverse video. */
  button { font: inherit; color: var(--fg); background: none; border: 0; border-radius: 0; padding: 0 6px;
    min-height: 40px; cursor: pointer; }
  header button::before, .br::before, .bar button::before, #photo-menu button::before { content: "["; color: var(--dim); }
  header button::after, .br::after, .bar button::after, #photo-menu button::after { content: "]"; color: var(--dim); }
  button:active, button.armed { background: var(--fg); color: var(--bg); }
  button:active::before, button:active::after, button.armed::before, button.armed::after { color: inherit; }
  button:disabled { color: var(--dim); }
  button.primary { color: var(--green); }
  button.danger { color: var(--red); }
  /* The clock strip is the home-indicator area itself, so the key bar sits as low as it can, right above it.
     With the keyboard up, or on a screen with no home indicator, the strip is 20px. */
  :root { --strip: max(env(safe-area-inset-bottom), 20px); }
  body.keyboard { --strip: 20px; }
  .view { position: absolute; top: env(safe-area-inset-top); left: 0; right: 0; bottom: var(--strip);
    display: flex; flex-direction: column; }
  /* The strip shows the time in its top part, over the home indicator's zone; nothing in it is tappable.
     A dim line splits it from the key bar or the list. The phone's tmux session has its status line turned off. */
  #statusline { position: absolute; left: 0; right: 0; bottom: 0; height: var(--strip); display: flex; align-items: flex-start;
    justify-content: center; padding-top: 2px; border-top: 1px solid var(--line); background: var(--bg); color: #a8a8a8;
    font-size: 12px; line-height: 15px; white-space: nowrap; }
  .hidden { display: none !important; }
  header { display: flex; align-items: center; padding: 0 2px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: inherit; color: var(--green); margin: 0 6px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #list-body { flex: 1; overflow-y: auto; }
  .window-name { color: var(--green); padding: 12px 8px 2px; }
  .pane { display: block; width: 100%; text-align: left; padding: 4px 8px 4px 24px; }
  .pane .top { display: flex; gap: 8px; }
  .pane .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane .line { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane:active .line { color: inherit; }
  .chip { white-space: nowrap; }
  .chip::before { content: "["; } .chip::after { content: "]"; }
  .chip.needs_you { color: var(--red); font-weight: bold; } .chip.working { color: var(--green); } .chip.idle { color: var(--dim); }
  .pane:active .chip { color: inherit; }
  #list-error { color: var(--red); padding: 8px; }
  /* Edit mode: [rename] [new pane] or [rename] [close] on a line under each name, and a [new window] row at the bottom. */
  .window-name, .pane .top { display: flex; align-items: center; gap: 8px; }
  .window-name { gap: 0; flex-wrap: wrap; } .window-name .name { margin-left: 1ch; }
  .window-name .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acts { display: flex; flex-basis: 100%; gap: 12px; }
  .acts button { min-height: 36px; padding: 0 4px; }
  .add-window { margin: 12px 4px 0; }
  /* The session row at the top of the list: session: [0] [work], the phone's session in reverse video. */
  #sessions { display: flex; flex-wrap: wrap; align-items: center; padding: 4px 4px 4px 8px; border-bottom: 1px solid var(--line); }
  #sessions .label { color: var(--dim); margin-right: 2px; }
  #sessions button { min-height: 36px; padding: 0 4px; }
  #sessions .current { background: var(--fg); color: var(--bg); }
  #sessions .current::before, #sessions .current::after { color: inherit; }
  #sessions .session { flex-basis: 100%; padding: 6px 0 0; }
  #sessions .session .name { flex: 0 1 auto; margin-left: 0; padding: 0 1ch; }
  #sessions .add-session { margin: 6px 0 4px; }
  .rename { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--green);
    border-radius: 0; padding: 0 4px; outline: none; }

  #term-wrap { flex: 1; min-height: 0; background: #000; position: relative; touch-action: none; }
  #term { width: 100%; height: 100%; }
  .bar { display: flex; overflow-x: auto; border-top: 1px solid var(--line); flex-shrink: 0; scrollbar-width: none; }
  .bar::-webkit-scrollbar { display: none; }
  /* The key bar is one row of short glyphs in three groups, split by dim bars. */
  .bar { align-items: center; gap: 6px; padding: 0 4px; }
  .bar button { flex-shrink: 0; min-height: 44px; padding: 0 7px; white-space: nowrap; }
  .bar .input { color: var(--cyan); }
  .bar .mod { color: var(--yellow); }
  .bar button:active, .bar button.armed { background: var(--fg); color: var(--bg); }
  .bar .sep { flex-shrink: 0; color: var(--line); padding: 0; user-select: none; -webkit-user-select: none; }
  /* Photo opens [paste] [library] in a row just above the key bar, over the bottom of the terminal. */
  #keys { position: relative; flex-shrink: 0; }
  #photo-menu { position: absolute; bottom: 100%; left: 0; display: flex; gap: 6px; padding: 0 4px; background: var(--bg);
    border: 1px solid var(--line); border-left: 0; border-bottom: 0; z-index: 6; }
  #photo-menu button { min-height: 44px; padding: 0 7px; color: var(--cyan); }
  /* [↓ bottom] sits at the bottom right of the terminal while the pane is scrolled back. */
  #to-bottom { position: absolute; bottom: 100%; right: 0; min-height: 44px; padding: 0 7px; background: var(--bg);
    border: 1px solid var(--line); border-right: 0; border-bottom: 0; z-index: 6; }
  #to-bottom::before { content: "["; color: var(--dim); } #to-bottom::after { content: "]"; color: var(--dim); }
  #mic.recording { background: var(--red); color: var(--bg); }
  #mic.recording::before, #mic.recording::after { color: inherit; }
  .icon { width: 20px; height: 20px; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 2; }
  /* Three dots bouncing in turn while a recording or photo is being sent. */
  .dots { color: var(--cyan); }
  .dots i { display: inline-block; width: 4px; height: 4px; margin: 0 1px; background: currentColor;
    animation: bounce 0.9s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: 0.15s; } .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
  #toast { position: fixed; left: 8px; right: 8px; bottom: 120px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--green); padding: 6px 8px; z-index: 10; }
</style>
</head>
<body>

<section id="list" class="view">
  <header>
    <h1>tmux</h1>
    <button id="edit">edit</button>
  </header>
  <div id="list-body"></div>
</section>

<section id="pane" class="view hidden">
  <header id="pane-header">
    <button id="back" aria-label="Back to panes">‹ Panes</button>
    <h1 id="pane-title"></h1>
    <button id="close-pane" class="danger">Close</button>
  </header>
  <div id="term-wrap"><div id="term"></div></div>
  <div id="keys">
  <div id="photo-menu" class="hidden"><button id="paste-photo">paste</button><button id="library">library</button></div>
  <button id="to-bottom" class="hidden">↓ bottom</button>
  <div class="bar">
    <button id="mic" class="input" aria-label="Mic"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button>
    <button id="attach" class="input" aria-label="Photo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <button data-key="enter" class="primary">enter</button>
    <span class="sep" aria-hidden="true">│</span>
    <button data-mod="ctrl" class="mod">ctrl</button>
    <button data-mod="alt" class="mod">alt</button>
    <span class="sep" aria-hidden="true">│</span>
    <button data-key="escape">esc</button>
    <button data-key="up">↑</button>
    <button data-key="down">↓</button>
    <button data-key="left">←</button>
    <button data-key="right">→</button>
    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button data-key="tab">tab</button>
    <button data-key="shift+tab">shift-tab</button>
    <button data-key="ctrl+c" class="danger">ctrl-c</button>
    <button data-key="alt+p">model</button>
  </div>
  </div>
</section>

<div id="statusline"></div>

<div id="toast" class="hidden"></div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const STATUS_LABEL = { needs_you: "needs you", working: "working", idle: "idle" };
let current = null;  // id of the pane open on the phone
let lastTitle = {};
let panes = [], sessions = [], editMode = false, renaming = false;  // the list skips its refresh while a name is being typed

// iOS keeps the layout height when the keyboard opens, and scrolls the page to show the focused input.
// Undo the scroll and pin the page to what is actually visible above the keyboard and its accessory bar.
// The terminal refits when its box changes size, so tmux gets the smaller screen.
function fitViewport() {
  window.scrollTo(0, 0);
  const vv = window.visualViewport || { height: window.innerHeight, offsetTop: 0 };
  document.body.style.setProperty("--vh", `${vv.height}px`);
  document.body.style.setProperty("--vtop", `${vv.offsetTop}px`);
  document.body.classList.toggle("keyboard", vv.height < window.innerHeight - 100);
}
for (const type of ["resize", "scroll"]) (window.visualViewport || window).addEventListener(type, fitViewport);
fitViewport();

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.remove("hidden");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.add("hidden"), 3000);
}

async function post(path, body = {}) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}

async function act(path, body) {
  try { return await post(path, body); } catch (e) {
    toast(e.message);
    if (/can't find (pane|window|session)/.test(e.message)) { current = null; showList(); }
    return null;
  }
}

function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function loadPanes() {
  if (renaming) return;
  let fresh;
  try {
    const r = await fetch("/api/panes");
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `Request failed (${r.status})`);
    fresh = await r.json();
  } catch (e) {
    if (!renaming) $("list-body").innerHTML = `<div id="list-error">Couldn't load panes: ${esc(e.message)}</div>`;
    return;
  }
  panes = fresh.panes;
  sessions = fresh.sessions;
  if (fresh.version !== VERSION) reloadWhenSafe();
  for (const p of panes) lastTitle[p.id] = p.title || p.command;
  if (!renaming) renderPanes();
}

// The strip at the bottom shows the local time as HH:MM, checked every 15 s.
function renderClock() {
  const now = new Date();
  $("statusline").textContent = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
}
renderClock();
setInterval(renderClock, 15000);

// In edit mode a pane row is not a button, so a tap on it opens nothing.
function renderPanes() {
  const windows = new Map();
  for (const p of panes) {
    if (!windows.has(p.window)) windows.set(p.window, { id: p.window_id, name: p.window_name, panes: [] });
    windows.get(p.window).panes.push(p);
  }
  const addWindow = editMode ? `<button class="br primary add-window" data-act="new-window">new window</button>` : "";
  const top = renderSessions();
  if (!panes.length) {
    $("list-body").innerHTML = `${top}<div class="window-name">No tmux panes. Tap [edit], then [new window].</div>${addWindow}`;
    return;
  }
  const chip = (p) => p.status ? `<span class="chip ${p.status}">${STATUS_LABEL[p.status]}</span>` : "";
  $("list-body").innerHTML = top + [...windows].map(([index, w]) => `
    <div class="window-name">
      <span>${index}:</span><span class="name rn-target">${esc(w.name)}</span>
      ${editMode ? `<span class="acts"><button class="br" data-act="rename-window" data-id="${w.id}">rename</button><button class="br primary" data-act="add-pane" data-id="${w.id}">new pane</button></span>` : ""}
    </div>
    ${w.panes.map((p) => editMode ? `
      <div class="pane">
        <div class="top">
          <span class="title rn-target">${esc(p.title || p.command)}</span>
          ${chip(p)}
        </div>
        <div class="line">${esc(p.last_line || " ")}</div>
        <div class="acts"><button class="br" data-act="rename-pane" data-id="${p.id}">rename</button><button class="br danger" data-act="close-pane" data-id="${p.id}">close</button></div>
      </div>` : `
      <button class="pane" data-pane="${p.id}">
        <div class="top">
          <span class="title">${esc(p.title || p.command)}</span>
          ${chip(p)}
        </div>
        <div class="line">${esc(p.last_line || " ")}</div>
      </button>`).join("")}`).join("") + addWindow;
}

// The session row: tap a session to show its windows on the phone. Hidden with one session, outside edit mode.
// In edit mode each session gets [rename] and [close], and the row ends with [new session].
function renderSessions() {
  if (!editMode) {
    if (sessions.length < 2) return "";
    return `<div id="sessions"><span class="label">session:</span>${sessions.map((s) =>
      `<button class="br${s.current ? " current" : ""}" data-act="switch-session" data-id="${s.id}">${esc(s.name)}</button>`).join("")}</div>`;
  }
  return `<div id="sessions"><span class="label">session:</span>${sessions.map((s) => `
    <div class="window-name session">
      <span class="name rn-target${s.current ? " current" : ""}">${esc(s.name)}</span>
      <span class="acts"><button class="br" data-act="rename-session" data-id="${s.id}">rename</button><button class="br danger" data-act="close-session" data-id="${s.id}">close</button></span>
    </div>`).join("")}<button class="br primary add-session" data-act="new-session">new session</button></div>`;
}

// A session change remakes the phone's tmux session, which ends the terminal's attach; connect again to the new one.
async function sessionAct(path, body) {
  const r = await act(path, body);
  if (r && socket) connect();
  loadPanes();
}

// [rename] swaps the name for a text box. Enter saves; Escape or tapping away keeps the old name.
function rename(target, name, path) {
  renaming = true;
  const input = Object.assign(document.createElement("input"), {
    className: "rename", value: name, maxLength: 100, enterKeyHint: "done", autocapitalize: "off", autocomplete: "off", spellcheck: false,
  });
  input.setAttribute("autocorrect", "off");
  target.replaceWith(input);
  input.focus();
  input.select();
  let finished = false;
  const finish = async (save) => {
    if (finished) return;
    finished = true;
    if (save && input.value.trim() && input.value !== name) await act(path, { name: input.value });
    renaming = false;
    loadPanes();
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") finish(false);
  });
  input.addEventListener("blur", () => finish(false));
}

$("list-body").addEventListener("click", async (e) => {
  const a = e.target.closest("[data-act]");
  if (!a) {
    const b = e.target.closest("[data-pane]");
    if (b) openPane(b.dataset.pane);
    return;
  }
  const id = a.dataset.id, target = a.closest(".window-name, .pane")?.querySelector(".rn-target");
  if (a.dataset.act === "switch-session") {
    if (!sessions.find((s) => s.id === id).current) sessionAct(`/api/sessions/${id}/switch`);
  } else if (a.dataset.act === "rename-session") {
    rename(target, sessions.find((s) => s.id === id).name, `/api/sessions/${id}/rename`);
  } else if (a.dataset.act === "close-session") {
    const s = sessions.find((s) => s.id === id), w = s.windows === 1 ? "1 window" : `${s.windows} windows`;
    if (confirm(`Close session "${s.name}"? Its ${w} close, and anything running in them stops.`)) sessionAct(`/api/sessions/${id}/close`);
  } else if (a.dataset.act === "new-session") {
    sessionAct("/api/sessions");
  } else if (a.dataset.act === "rename-window") {
    rename(target, panes.find((p) => p.window_id === id).window_name, `/api/windows/${id}/rename`);
  } else if (a.dataset.act === "rename-pane") {
    rename(target, panes.find((p) => p.id === id).title, `/api/panes/${id}/rename`);
  } else if (a.dataset.act === "close-pane") {
    if (confirm(`Close "${lastTitle[id]}"? Anything running in it stops.`) && await act(`/api/panes/${id}/close`)) loadPanes();
  } else {
    const r = await act(a.dataset.act === "add-pane" ? `/api/windows/${id}/panes` : "/api/windows");
    if (r) openPane(r.pane);
  }
});

$("edit").addEventListener("click", () => {
  editMode = !editMode;
  $("edit").textContent = editMode ? "done" : "edit";
  renderPanes();
});

// A new version on the Mac reloads the page, as the Home Screen app has no reload button.
// Never in the middle of something: a recording, a send, a name being typed, the photo menu.
// Until then each list poll tries again. The open pane is opened again after the reload.
const VERSION = document.querySelector('meta[name="version"]').content, PANE_KEY = "tmux-phone.pane";
function reloadWhenSafe() {
  if (recorder || unsent || $("mic").disabled || $("attach").disabled || renaming || !$("photo-menu").classList.contains("hidden")) return;
  try { if (current) sessionStorage.setItem(PANE_KEY, current); } catch {}
  location.reload();
}

async function openPane(id) {
  if (!(await act(`/api/panes/${id}/open`))) return;
  current = id;
  atBottom();
  $("pane-title").textContent = lastTitle[id] || "";
  $("list").classList.add("hidden");
  $("pane").classList.remove("hidden");
  // One terminal connection for the whole visit; tmux switches what it shows.
  if (!socket) startTerminal();
  loadPanes();
}

async function showList() {
  stopRecording(true);
  disarm();
  $("photo-menu").classList.add("hidden");
  unsent = null;
  setMic(MIC_ICON);
  if (current) await act(`/api/panes/${current}/back`);
  current = null;
  $("pane").classList.add("hidden");
  $("list").classList.remove("hidden");
  loadPanes();
}

$("back").addEventListener("click", showList);

$("close-pane").addEventListener("click", async () => {
  if (!confirm(`Close "${$("pane-title").textContent}"? Anything running in it stops.`)) return;
  if (await act(`/api/panes/${current}/close`)) { current = null; showList(); }
});

document.querySelectorAll("[data-key]").forEach((b) => b.addEventListener("click", () => {
  disarm();
  atBottom();
  act(`/api/panes/${current}/key`, { key: b.dataset.key });
}));

// iOS shows :active, the pressed look, only when the page listens for touches.
document.addEventListener("touchstart", () => {}, { passive: true });

// Keep the keyboard open: a tap on the key bar must not take focus away from the terminal.
// iOS moves focus on the mousedown it fires after the touch. Blocking pointerdown instead would also block the click.
// The photo menu above the bar is in the same box, so this covers it too.
$("keys").addEventListener("mousedown", (e) => e.preventDefault());

// Ctrl and Alt stay on until the next key typed into the terminal, so Ctrl then b is the tmux prefix.
const mods = { ctrl: false, alt: false };

function setMod(name, on) {
  mods[name] = on;
  document.querySelector(`[data-mod="${name}"]`).classList.toggle("armed", on);
}

function disarm() {
  setMod("ctrl", false);
  setMod("alt", false);
}

document.querySelectorAll("[data-mod]").forEach((b) => b.addEventListener("click", () => setMod(b.dataset.mod, !mods[b.dataset.mod])));

// Ctrl turns one typed character into its control code, Alt puts ESC before it. Longer text, like a paste, goes as is.
function withMods(data) {
  let out = data;
  if (data.length === 1) {
    const c = data.charCodeAt(0);
    if (mods.ctrl && c === 32) out = "\x00";
    else if (mods.ctrl && ((c >= 64 && c <= 95) || (c >= 97 && c <= 122))) out = String.fromCharCode(c & 0x1f);
    if (mods.alt) out = "\x1b" + out;
  }
  disarm();
  return out;
}

// A picked photo is pasted into the pane right away as a file path on the Mac, which Claude Code
// turns into an image attachment. Enter submits it.
async function photoBase64(file) {
  // Redrawing on a canvas turns HEIC into JPEG and keeps big photos small; Claude downsizes past ~1600px anyway.
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 2000 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.9));
  return new Promise((r) => {
    const reader = new FileReader();
    reader.onload = () => r(reader.result.split(",")[1]);
    reader.readAsDataURL(blob);
  });
}

async function sendPhotos(blobs) {
  const pane = current, images = [];
  $("attach").disabled = true;
  $("attach").innerHTML = DOTS;
  for (const f of blobs) await photoBase64(f).then((b) => images.push(b), (e) => toast(`Couldn't read ${f.name || "image"}: ${e.message}`));
  if (images.length && pane === current && await act(`/api/panes/${pane}/paste`, { images })) atBottom();
  $("attach").disabled = false;
  $("attach").innerHTML = PHOTO_ICON;
}

// Photo toggles a small menu: [paste] takes an image from the clipboard, [library] opens the photo picker.
// A tap anywhere else closes it.
$("attach").addEventListener("click", () => $("photo-menu").classList.toggle("hidden"));
document.addEventListener("pointerdown", (e) => {
  if (!e.target.closest("#photo-menu, #attach")) $("photo-menu").classList.add("hidden");
});
$("library").addEventListener("click", () => {
  $("photo-menu").classList.add("hidden");
  $("file").click();
});
$("file").addEventListener("change", () => {
  const files = [...$("file").files];
  $("file").value = "";
  sendPhotos(files);
});
// iOS lets a page read the clipboard only inside the tap, so clipboard.read() runs before any await.
// iOS then shows its own Paste button, which the user taps.
$("paste-photo").addEventListener("click", async () => {
  $("photo-menu").classList.add("hidden");
  let blob;
  try {
    const items = await navigator.clipboard.read();
    const item = items.find((i) => i.types.some((t) => t.startsWith("image/")));
    if (!item) return toast("no image in clipboard");
    blob = await item.getType(item.types.find((t) => t.startsWith("image/")));
  } catch (e) {
    return toast(e.message);
  }
  sendPhotos([blob]);
});

// Tap Mic to record, tap it again to end. The Mac transcribes it and pastes the text into the pane, without Enter.
// A recording that fails to transcribe or paste is kept, and Mic becomes Retry, so nothing said is lost.
let recorder = null, unsent = null, timer = null;
const MIC_ICON = $("mic").innerHTML, PHOTO_ICON = $("attach").innerHTML;
const DOTS = `<span class="dots"><i></i><i></i><i></i></span>`;

function setMic(html, { recording = false, busy = false } = {}) {
  const mic = $("mic");
  mic.innerHTML = html;
  mic.classList.toggle("recording", recording);
  mic.disabled = busy;
}

function stopRecording(discard) {
  if (!recorder) return;
  recorder.discard = discard;
  recorder.stop();
}

async function sendAudio(audio) {
  const pane = current;
  setMic(DOTS, { busy: true });
  try {
    const r = await fetch("/api/transcribe", { method: "POST", headers: { "Content-Type": audio.type }, body: audio });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
    if (pane !== current) return;  // left that pane while it was transcribing
    if (data.text) { await post(`/api/panes/${pane}/paste`, { text: data.text }); atBottom(); }
    unsent = null;
    setMic(MIC_ICON);
    if (!data.text) toast("Didn't catch anything.");
  } catch (e) {
    if (pane !== current) return;
    unsent = audio;
    setMic("retry");
    toast(e.message);
  }
}

$("mic").addEventListener("click", async () => {
  if (recorder) return stopRecording(false);
  if (unsent) return sendAudio(unsent);
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    return toast(`Microphone blocked: ${e.message}`);
  }
  const chunks = [], started = Date.now();
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    clearInterval(timer);
    const { discard, mimeType } = recorder;
    recorder = null;
    if (discard) return setMic(MIC_ICON);
    const type = (mimeType || "audio/mp4").split(";")[0];
    sendAudio(new Blob(chunks, { type }));
  };
  recorder.start();
  const tick = () => {
    const s = Math.floor((Date.now() - started) / 1000);
    setMic(`${MIC_ICON} ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`, { recording: true });
  };
  tick();
  timer = setInterval(tick, 1000);
});

// Our own client for ttyd's websocket (ttyd 1.7.7). The page sends its size as JSON first, then
// "0" + typed bytes and "1" + new size. ttyd sends "0" + output, "1" + title, "2" + its settings.
// Pinch on the terminal sets its font size; it is kept in this browser for next time.
const MIN_FONT = 8, MAX_FONT = 20, FONT_KEY = "tmux-phone.fontSize";
function savedFontSize() {
  try {
    const n = Number(localStorage.getItem(FONT_KEY));
    return n >= MIN_FONT && n <= MAX_FONT ? n : 13;
  } catch { return 13; }
}
const term = new Terminal({ fontSize: savedFontSize(), fontFamily: "Menlo, monospace", theme: { background: "#000000" } });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
const encoder = new TextEncoder();
let socket = null, retryMs = 1000, retryTimer = null;

function startTerminal() {
  term.open($("term"));
  fit.fit();
  term.onData((data) => {
    if (socket.readyState !== WebSocket.OPEN) return;
    atBottom();
    socket.send(encoder.encode("0" + withMods(data)));
  });
  term.onResize(({ cols, rows }) => {
    if (socket.readyState === WebSocket.OPEN) socket.send(encoder.encode("1" + JSON.stringify({ columns: cols, rows })));
  });
  // Fit to the box whenever it changes size, e.g. when the keyboard opens. Skipped while hidden, which reads as 0 wide.
  // Waits 50 ms for the size to settle, as the keyboard slides in over several steps.
  let fitTimer = null;
  new ResizeObserver(() => {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(() => { if ($("term-wrap").clientWidth) fit.fit(); }, 50);
  }).observe($("term-wrap"));
  connect();
}

// Any close reconnects by itself, waiting 1 s, then 2 s, up to 5 s; nothing needs a key press.
function connect() {
  clearTimeout(retryTimer);
  if (socket) { socket.onclose = socket.onmessage = null; socket.close(); }
  const ws = socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/term/ws`, ["tty"]);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    retryMs = 1000;
    term.reset();  // tmux redraws the whole screen on attach
    ws.send(encoder.encode(JSON.stringify({ AuthToken: "", columns: term.cols, rows: term.rows })));
  };
  ws.onmessage = (e) => {
    const data = new Uint8Array(e.data);
    if (data[0] === 48) term.write(data.subarray(1));  // "0" is output; title and settings are not used
  };
  ws.onclose = () => {
    retryTimer = setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 5000);
  };
}

// tmux draws on the terminal's alternate screen, so the browser terminal has nothing of its own to scroll.
// A vertical swipe sends mouse wheel input to tmux instead, as the Mac's wheel does: tmux hands it to the app
// if the app reads the mouse (Claude Code scrolls its own chat), and scrolls the pane's history if not.
// This needs `mouse on` in tmux, which also makes tmux ask for SGR mouse codes. A tap opens the keyboard.
// The text follows the finger: one wheel event per (row height x lines one event scrolls) of finger movement.
// tmux's copy mode scrolls 5 lines per event (its WheelUpPane binding); Claude Code scrolls 1 (measured).
const APP_LINES = 1, COPY_LINES = 5, MAX_WHEEL = 10;
let scrollY = null, scrollPx = 0, swiped = false;
let wheelUps = 0;  // net wheel-up events since the pane was last at the bottom; [↓ bottom] shows while above 0
let pinch = null;  // finger distance and font size when a two-finger pinch began
const fingerGap = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

function setFontSize(size) {
  size = Math.min(MAX_FONT, Math.max(MIN_FONT, size));
  if (size === term.options.fontSize) return;
  term.options.fontSize = size;
  fit.fit();  // the new columns and rows go to ttyd through onResize, and tmux re-fits the window
  try { localStorage.setItem(FONT_KEY, String(size)); } catch {}
}

function atBottom() {
  wheelUps = 0;
  $("to-bottom").classList.add("hidden");
}

function wheelPx() {
  const rowPx = term.element.querySelector(".xterm-screen").getBoundingClientRect().height / term.rows;
  const p = panes.find((p) => p.id === current);
  return rowPx * (p && p.reads_mouse ? APP_LINES : COPY_LINES);
}

function sendWheel(up, count, x, y) {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  wheelUps = Math.max(0, wheelUps + (up ? count : -count));
  $("to-bottom").classList.toggle("hidden", !wheelUps);
  const box = term.element.querySelector(".xterm-screen").getBoundingClientRect();
  const col = Math.min(term.cols, Math.max(1, Math.floor((x - box.left) / (box.width / term.cols)) + 1));
  const row = Math.min(term.rows, Math.max(1, Math.floor((y - box.top) / (box.height / term.rows)) + 1));
  socket.send(encoder.encode("0" + `\x1b[<${up ? 64 : 65};${col};${row}M`.repeat(count)));
}

$("term-wrap").addEventListener("touchstart", (e) => {
  if (e.touches.length > 1) {
    // A second finger turns the touch into a pinch, which never scrolls and never opens the keyboard.
    pinch = { gap: fingerGap(e.touches), size: term.options.fontSize };
    scrollY = null;
    swiped = true;
    return;
  }
  pinch = null;
  scrollY = e.touches[0].clientY;
  scrollPx = 0;
  swiped = false;
}, { passive: true, capture: true });
$("term-wrap").addEventListener("touchmove", (e) => {
  if (pinch) {
    e.preventDefault();
    e.stopPropagation();
    if (e.touches.length > 1) setFontSize(Math.round(pinch.size * fingerGap(e.touches) / pinch.gap));
    return;
  }
  if (scrollY === null || e.touches.length > 1) return;
  e.preventDefault();
  e.stopPropagation();  // the terminal's own touch scrolling has nothing to scroll
  const { clientX: x, clientY: y } = e.touches[0];
  scrollPx += y - scrollY;  // finger moving down shows older lines, like wheel up
  scrollY = y;
  const step = wheelPx(), events = Math.trunc(scrollPx / step);
  if (!events) return;
  swiped = true;
  scrollPx -= events * step;
  sendWheel(events > 0, Math.min(Math.abs(events), MAX_WHEEL), x, y);
}, { passive: false, capture: true });
$("term-wrap").addEventListener("touchend", (e) => {
  if (e.touches.length) return;  // a finger is still down
  pinch = null;
  scrollY = null;
  if (!swiped) term.focus();  // inside the touch, so iOS opens the keyboard
}, { passive: true, capture: true });

// [↓ bottom] sends wheel-down in chunks of 10, 20 more than were sent up, in case the count is off.
// In copy mode tmux leaves it at the bottom; Claude Code ignores the extra.
$("to-bottom").addEventListener("click", async () => {
  const box = term.element.querySelector(".xterm-screen").getBoundingClientRect();
  let left = wheelUps + 20;
  atBottom();
  while (left > 0) {
    sendWheel(false, Math.min(left, 10), box.left + box.width / 2, box.top + box.height / 2);
    left -= 10;
    await new Promise((r) => setTimeout(r, 30));
  }
});

// Only the terminal zooms: stop iOS from zooming the whole page on a pinch.
for (const type of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(type, (e) => e.preventDefault());

// Swipe right on the header goes back to the list; the terminal itself keeps its own touches.
let touchX = null;
$("pane-header").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; });
$("pane-header").addEventListener("touchend", (e) => {
  if (touchX !== null && e.changedTouches[0].clientX - touchX > 80) showList();
  touchX = null;
});

// iOS drops the connection while the app is in the background; reconnect at once on return.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && socket && socket.readyState !== WebSocket.OPEN) connect();
});

// The poll also runs in the pane view, to see a new version.
setInterval(() => { if (!document.hidden) loadPanes(); }, 3000);
loadPanes();
let reopen = null;
try { reopen = sessionStorage.getItem(PANE_KEY); sessionStorage.removeItem(PANE_KEY); } catch {}
if (reopen) openPane(reopen);
</script>
</body>
</html>
