<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="tmux">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="version" content="{{VERSION}}">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>tmux</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root {
    --bg: #000; --fg: #d0d0d0; --dim: #767676; --line: #303030;
    --green: #5fd75f; --red: #ff5f5f; --yellow: #d7d75f; --cyan: #5fd7d7; --magenta: #d787d7; --blue: #87afd7;
    --font: Menlo, ui-monospace, "SF Mono", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); }
  /* The views fill the body, which is pinned to what is visible, so the key bar sits right on the keyboard. */
  body { position: fixed; left: 0; right: 0; top: var(--vtop, 0); height: var(--vh, 100dvh); overflow: hidden; }
  /* Header buttons read as [Label]. Pressed or armed shows in reverse video. */
  button { font: inherit; color: var(--fg); background: none; border: 0; border-radius: 0; padding: 0 6px;
    min-height: 40px; cursor: pointer; }
  header button::before, .br::before, .bar button::before { content: "["; color: var(--dim); }
  header button::after, .br::after, .bar button::after { content: "]"; color: var(--dim); }
  button:active, button.armed { background: var(--fg); color: var(--bg); }
  button:active::before, button:active::after, button.armed::before, button.armed::after { color: inherit; }
  button:disabled { color: var(--dim); }
  button.primary { color: var(--green); }
  button.danger { color: var(--red); }
  /* The clock strip is the home-indicator area itself, so the key bar sits as low as it can, right above it.
     With the keyboard up, or on a screen with no home indicator, the strip is 20px. */
  :root { --strip: max(env(safe-area-inset-bottom), 20px); }
  body.keyboard { --strip: 20px; }
  .view { position: absolute; top: env(safe-area-inset-top); left: 0; right: 0; bottom: var(--strip);
    display: flex; flex-direction: column; }
  /* The strip names the open pane's window (or the list's session) in its top part, over the home indicator's zone;
     nothing in it is tappable.
     A dim line splits it from the key bar or the list. The phone's tmux session has its status line turned off. */
  #statusline { position: absolute; left: 0; right: 0; bottom: 0; height: var(--strip); display: flex; align-items: flex-start;
    justify-content: center; padding-top: 2px; border-top: 1px solid var(--line); background: var(--bg); color: var(--fg);
    font-size: 12px; line-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hidden { display: none !important; }
  header { display: flex; align-items: center; padding: 0 2px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: inherit; color: var(--green); margin: 0 6px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #list-body { flex: 1; overflow-y: auto; }
  /* Each window's panes hang under it as a tree: ├─ for each pane but the last, └─ for the last, and a dim line
     down the left of a pane's lines and its actions, so it is plain which window a pane belongs to. */
  .window-name { color: var(--green); padding: 14px 8px 0; }
  .pane { position: relative; display: block; width: 100%; min-height: 0; text-align: left; padding: 1px 8px 1px calc(8px + 3ch); }
  .pane::before { content: "├─"; position: absolute; left: 8px; top: 1px; color: var(--dim); }
  .pane.last::before { content: "└─"; }
  .pane:not(.last) { padding-bottom: 11px; }  /* space before the next pane, inside the row so the tree line runs through it */
  .pane:not(.last)::after { content: ""; position: absolute; left: calc(8px + 0.5ch - 0.5px); top: 0; bottom: 0; width: 1px;
    background: var(--dim); }
  .pane .top { display: flex; gap: 8px; }
  .pane .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane .line { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane:active .line { color: inherit; }
  /* Claude Code's state, plain text at the right of the title: not a button, so no brackets. */
  .status { white-space: nowrap; }
  .status.needs_you { color: var(--red); font-weight: bold; } .status.working { color: var(--green); } .status.idle { color: var(--dim); }
  .pane:active .status { color: inherit; }
  #list-error { color: var(--red); padding: 8px; }
  .window-name { display: flex; align-items: center; } .window-name .name { margin-left: 1ch; }
  .window-name .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane .top { align-items: center; }
  /* The session row at the top of the list: session: [0] [work], the phone's session in reverse video. */
  #sessions { display: flex; flex-wrap: wrap; align-items: center; padding: 4px 4px 4px 8px; border-bottom: 1px solid var(--line); }
  #sessions .label { color: var(--dim); margin-right: 2px; }
  #sessions button { min-height: 36px; padding: 0 4px; }
  #sessions .current { background: var(--fg); color: var(--bg); }
  #sessions .current::before, #sessions .current::after { color: inherit; }
  /* Edit mode: each session on its own row, and each row's buttons at its right; the name is cut to make room.
     [+ session] follows the last session, [+ window] the last window. */
  #sessions.editing { display: block; padding: 4px 4px 4px 8px; }
  .session-row { display: flex; align-items: center; }
  .session-row .name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 1ch; }
  .session-row .gap { flex: 1; }
  .acts { display: flex; flex-shrink: 0; gap: 4px; margin-left: auto; }
  .acts button, .add-window, .add-session { min-height: 36px; padding: 0 2px; }
  .add-window { margin: 10px 4px 0; }
  /* A pane's buttons reach past its title line to be easy to tap, without making the line taller, so the tree glyph stays level. */
  .pane .acts button { min-height: 0; padding: 8px 2px; margin: -8px 0; }
  .rename { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--green);
    border-radius: 0; padding: 0 4px; outline: none; }

  #term-wrap { flex: 1; min-height: 0; background: var(--bg); position: relative; touch-action: none; overflow: hidden; }
  #term { width: 100%; height: 100%; }
  .bar { display: flex; overflow-x: auto; border-top: 1px solid var(--line); flex-shrink: 0; scrollbar-width: none; }
  .bar::-webkit-scrollbar { display: none; }
  /* The key bar is one row of short glyphs in three groups, split by dim bars. */
  .bar { align-items: center; gap: 6px; padding: 0 4px; }
  .bar button { flex-shrink: 0; min-height: 44px; padding: 0 7px; white-space: nowrap; }
  .bar .input { color: var(--cyan); }
  .bar .mod { color: var(--yellow); }
  .bar button:active, .bar button.armed { background: var(--fg); color: var(--bg); }
  .bar .sep { flex-shrink: 0; color: var(--line); padding: 0; user-select: none; -webkit-user-select: none; }
  #keys { position: relative; flex-shrink: 0; }
  /* [↓ bottom] sits at the bottom right of the terminal while the pane is scrolled back. */
  #to-bottom { position: absolute; bottom: 100%; right: 0; min-height: 44px; padding: 0 7px; background: var(--bg);
    border: 1px solid var(--line); border-right: 0; border-bottom: 0; z-index: 6; }
  #to-bottom::before { content: "["; color: var(--dim); } #to-bottom::after { content: "]"; color: var(--dim); }
  #mic.recording { background: var(--red); color: var(--bg); }
  #mic.recording::before, #mic.recording::after { color: inherit; }
  .icon { width: 20px; height: 20px; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 2; }
  /* Three dots bouncing in turn while a recording, photo or paste is being sent. */
  .dots { color: var(--cyan); }
  .dots i { display: inline-block; width: 4px; height: 4px; margin: 0 1px; background: currentColor;
    animation: bounce 0.9s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: 0.15s; } .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
  /* The file screen: a folder's entries, or one file in CodeMirror. Its font size is the terminal's. */
  #files-title.path { direction: rtl; text-align: left; }  /* a long path is cut from the left, so its end shows */
  #folder { flex: 1; overflow-y: auto; }
  .entry { display: block; width: 100%; min-height: 36px; text-align: left; padding: 0 8px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .entry.folder { color: var(--cyan); }
  #file-note { padding: 8px; color: var(--dim); }
  #file-body { flex: 1; min-height: 0; }
  #file-body .cm-editor { height: 100%; background: var(--bg); color: var(--fg); font-size: var(--font-size, 13px); }
  #file-body .cm-editor.cm-focused { outline: none; }
  #file-body .cm-scroller { font-family: var(--font); line-height: 1.4; -webkit-overflow-scrolling: touch; }
  #file-body .cm-content { caret-color: var(--fg); }
  #file-body .cm-gutters { background: var(--bg); color: var(--dim); border-right: 1px solid var(--line); }
  #file-body .tok-keyword { color: var(--magenta); } #file-body .tok-string, #file-body .tok-string2 { color: var(--green); }
  #file-body .tok-comment { color: var(--dim); font-style: italic; } #file-body .tok-meta { color: var(--dim); }
  #file-body .tok-number, #file-body .tok-bool, #file-body .tok-atom, #file-body .tok-literal { color: var(--yellow); }
  #file-body .tok-typeName, #file-body .tok-className, #file-body .tok-namespace { color: var(--cyan); }
  #file-body .tok-propertyName { color: var(--blue); } #file-body .tok-definition { color: var(--fg); }
  #file-body .tok-heading { color: var(--green); font-weight: bold; } #file-body .tok-link, #file-body .tok-url { color: var(--cyan); }
  #file-body .tok-emphasis { font-style: italic; } #file-body .tok-strong { font-weight: bold; }
  #file-body .tok-inserted { color: var(--green); } #file-body .tok-deleted, #file-body .tok-invalid { color: var(--red); }
  /* The theme screen: one row per theme, drawn in its own colors, with its six colors after the name. */
  #theme-list { flex: 1; overflow-y: auto; }
  .theme-row { display: flex; width: 100%; min-height: 44px; align-items: center; gap: 1ch; text-align: left; padding: 0 8px; }
  .theme-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .theme-row.current { outline: 2px solid var(--green); outline-offset: -2px; }
  #toast { position: fixed; left: 8px; right: 8px; bottom: 120px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--green); padding: 6px 8px; z-index: 10; }
</style>
</head>
<body>

<section id="list" class="view">
  <header>
    <h1>tmux</h1>
    <button id="theme-open">theme</button>
    <button id="edit">edit</button>
  </header>
  <div id="list-body"></div>
</section>

<section id="pane" class="view hidden">
  <header id="pane-header">
    <button id="back" aria-label="Back to panes">‹ Panes</button>
    <h1 id="pane-title"></h1>
    <button id="files-open">files</button>
    <button id="close-pane" class="danger">Close</button>
  </header>
  <div id="term-wrap"><div id="term"></div></div>
  <div id="keys">
  <button id="to-bottom" class="hidden">↓ bottom</button>
  <div class="bar">
    <button id="mic" class="input" aria-label="Mic"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button>
    <button id="attach" class="input" aria-label="Photo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <button id="paste" class="input">paste</button>
    <button data-key="enter" class="primary">enter</button>
    <span class="sep" aria-hidden="true">│</span>
    <button data-mod="ctrl" class="mod">ctrl</button>
    <button data-mod="alt" class="mod">alt</button>
    <span class="sep" aria-hidden="true">│</span>
    <button data-key="escape">esc</button>
    <button data-key="up">↑</button>
    <button data-key="down">↓</button>
    <button data-key="left">←</button>
    <button data-key="right">→</button>
    <button data-key="0">0</button>
    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button data-key="tab">tab</button>
    <button data-key="shift+tab">shift-tab</button>
    <button data-key="ctrl+c" class="danger">ctrl-c</button>
    <button data-key="alt+p">model</button>
  </div>
  </div>
</section>

<section id="files" class="view hidden">
  <header>
    <button id="files-back">‹ back</button>
    <h1 id="files-title"></h1>
    <button id="file-edit" class="hidden">edit</button>
  </header>
  <div id="folder"></div>
  <div id="file-note" class="hidden"></div>
  <div id="file-body" class="hidden"></div>
</section>

<section id="themes" class="view hidden">
  <header>
    <button id="themes-back">‹ back</button>
    <h1>theme</h1>
  </header>
  <div id="theme-list"></div>
</section>

<div id="statusline"></div>

<div id="toast" class="hidden"></div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/codemirror.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const STATUS_LABEL = { needs_you: "needs you", working: "working", idle: "idle" };
let current = null;  // id of the pane open on the phone
let lastTitle = {};
let panes = [], sessions = [], editMode = false, renaming = false;  // the list skips its refresh while a name is being typed

// iOS keeps the layout height when the keyboard opens, and scrolls the page to show the focused input.
// Undo the scroll and pin the page to what is actually visible above the keyboard and its accessory bar.
// The terminal refits when its box changes size, so tmux gets the smaller screen.
function fitViewport() {
  window.scrollTo(0, 0);
  const vv = window.visualViewport || { height: window.innerHeight, offsetTop: 0 };
  document.body.style.setProperty("--vh", `${vv.height}px`);
  document.body.style.setProperty("--vtop", `${vv.offsetTop}px`);
  document.body.classList.toggle("keyboard", vv.height < window.innerHeight - 100);
}
for (const type of ["resize", "scroll"]) (window.visualViewport || window).addEventListener(type, fitViewport);
fitViewport();

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.remove("hidden");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.add("hidden"), 3000);
}

async function post(path, body = {}) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}

async function act(path, body) {
  try { return await post(path, body); } catch (e) {
    toast(e.message);
    if (/can't find (pane|window|session)/.test(e.message)) { current = null; showList(); }
    return null;
  }
}

function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// A poll in edit mode keeps the data but does not redraw, so a tap is never lost to a redraw mid-press.
async function loadPanes(poll = false) {
  if (renaming) return;
  let fresh;
  try {
    const r = await fetch("/api/panes");
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `Request failed (${r.status})`);
    fresh = await r.json();
  } catch (e) {
    if (!renaming) $("list-body").innerHTML = `<div id="list-error">Couldn't load panes: ${esc(e.message)}</div>`;
    return;
  }
  panes = fresh.panes;
  sessions = fresh.sessions;
  if (fresh.version !== VERSION) reloadWhenSafe();
  const open = panes.find((p) => p.id === current);
  if (open) hideBorderRow(open.border);
  for (const p of panes) lastTitle[p.id] = p.title || p.command;
  renderStrip();
  if (!renaming && !(poll && editMode)) renderPanes();
}

// The strip at the bottom names where the phone is: the open pane's window as "2: agent", or in the list "session 0".
function renderStrip() {
  const p = panes.find((p) => p.id === current), s = sessions.find((s) => s.current);
  $("statusline").textContent = current ? (p ? `${p.window}: ${p.window_name}` : "") : (s ? `session ${s.name}` : "");
}

// In edit mode each session, window and pane row ends with its buttons; a pane row is a div then, not a button.
function renderPanes() {
  const windows = new Map();
  for (const p of panes) {
    if (!windows.has(p.window)) windows.set(p.window, { id: p.window_id, name: p.window_name, panes: [] });
    windows.get(p.window).panes.push(p);
  }
  const b = (act, id, label, cls = "") => `<button class="br ${cls}" data-act="${act}" data-id="${id}">${label}</button>`;
  const acts = (...buttons) => (editMode ? `<span class="acts">${buttons.join("")}</span>` : "");
  const addWindow = editMode ? `<button class="br primary add-window" data-act="new-window">+ window</button>` : "";
  const top = renderSessions(b);
  if (!panes.length) {
    $("list-body").innerHTML = `${top}<div class="window-name">No tmux panes. Tap [edit], then [+ window].</div>${addWindow}`;
    return;
  }
  const chip = (p) => p.status ? `<span class="status ${p.status}">${STATUS_LABEL[p.status]}</span>` : "";
  const tag = editMode ? "div" : "button";
  $("list-body").innerHTML = top + [...windows].map(([index, w]) => `
    <div class="window-name"><span>${index}:</span><span class="name">${esc(w.name)}</span>${acts(
      b("rename-window", w.id, "rename"), b("add-pane", w.id, "+ pane", "primary"), b("close-window", w.id, "x", "danger"))}</div>
    ${w.panes.map((p, i) => `
      <${tag} class="pane${i === w.panes.length - 1 ? " last" : ""}" data-pane="${p.id}">
        <div class="top">
          <span class="title name">${esc(p.title || p.command)}</span>
          ${chip(p)}${acts(b("rename-pane", p.id, "rename"), b("close-pane", p.id, "x", "danger"))}
        </div>
        <div class="line">${esc(p.last_line || " ")}</div>
      </${tag}>`).join("")}`).join("") + addWindow;
}

// The session row: tap a session to show its windows on the phone. Hidden with one session, outside edit mode.
// In edit mode each session gets its own row with [rename] [x], the phone's session in reverse video.
function renderSessions(b) {
  if (editMode) return `<div id="sessions" class="editing">${sessions.map((s) => `
    <div class="session-row"><span class="name${s.current ? " current" : ""}">${esc(s.name)}</span><span class="gap"></span><span class="acts">${
      b("rename-session", s.id, "rename")}${b("close-session", s.id, "x", "danger")}</span></div>`).join("")}
    <button class="br primary add-session" data-act="new-session">+ session</button></div>`;
  if (sessions.length < 2) return "";
  return `<div id="sessions"><span class="label">session:</span>${sessions.map((s) =>
    `<button class="br${s.current ? " current" : ""}" data-session="${s.id}">${esc(s.name)}</button>`).join("")}</div>`;
}

// A session change remakes the phone's tmux session, which ends the terminal's attach; connect again to the new one.
async function sessionAct(path, body) {
  const r = await act(path, body);
  if (r && socket) connect();
  loadPanes();
}

// [rename] swaps the name for a text box. Enter or tapping away saves; Escape keeps the old name.
// An empty or unchanged name sends nothing.
function rename(target, name, path) {
  renaming = true;
  const input = Object.assign(document.createElement("input"), {
    className: "rename", value: name, maxLength: 100, enterKeyHint: "done", autocapitalize: "off", autocomplete: "off", spellcheck: false,
  });
  input.setAttribute("autocorrect", "off");
  target.replaceWith(input);
  input.focus();
  input.select();
  let finished = false;
  const finish = async (save) => {
    if (finished) return;
    finished = true;
    // The name goes back in place at once, so the row is whole again before the save returns.
    const changed = save && input.value.trim() && input.value !== name;
    if (changed) target.textContent = input.value;
    input.replaceWith(target);
    if (changed) await act(path, { name: input.value });
    renaming = false;
    loadPanes();
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") finish(false);
  });
  input.addEventListener("blur", () => finish(true));
}

// A tap on a button runs it. Outside edit mode a tap on a pane opens it, on a session switches to it.
$("list-body").addEventListener("click", async (e) => {
  if (renaming) return;
  const a = e.target.closest("[data-act]");
  if (a) return runAction(a.dataset.act, a.dataset.id, a.closest(".session-row, .window-name, .pane")?.querySelector(".name"));
  if (editMode) return;
  const pane = e.target.closest("[data-pane]"), session = e.target.closest("[data-session]");
  if (pane) openPane(pane.dataset.pane);
  else if (session && !sessions.find((s) => s.id === session.dataset.session).current) sessionAct(`/api/sessions/${session.dataset.session}/switch`);
});

async function runAction(action, id, name) {
  if (action === "rename-session") {
    rename(name, sessions.find((s) => s.id === id).name, `/api/sessions/${id}/rename`);
  } else if (action === "rename-window") {
    rename(name, panes.find((p) => p.window_id === id).window_name, `/api/windows/${id}/rename`);
  } else if (action === "rename-pane") {
    rename(name, panes.find((p) => p.id === id).title, `/api/panes/${id}/rename`);
  } else if (action === "close-session") {
    const s = sessions.find((s) => s.id === id), w = s.windows === 1 ? "1 window" : `${s.windows} windows`;
    if (confirm(`Close session "${s.name}"? Its ${w} close, and anything running in them stops.`)) sessionAct(`/api/sessions/${id}/close`);
  } else if (action === "new-session") {
    sessionAct("/api/sessions");
  } else if (action === "close-window") {
    const ps = panes.filter((p) => p.window_id === id), n = ps.length === 1 ? "1 pane" : `${ps.length} panes`;
    if (confirm(`Close window "${ps[0].window_name}"? Its ${n} close, and anything running in them stops.`) && await act(`/api/windows/${id}/close`)) loadPanes();
  } else if (action === "close-pane") {
    if (confirm(`Close "${lastTitle[id]}"? Anything running in it stops.`) && await act(`/api/panes/${id}/close`)) loadPanes();
  } else {
    const r = await act(action === "add-pane" ? `/api/windows/${id}/panes` : "/api/windows");
    if (r) openPane(r.pane);
  }
}

$("edit").addEventListener("click", () => {
  editMode = !editMode;
  $("edit").textContent = editMode ? "done" : "edit";
  renderPanes();
});

// A new version on the Mac reloads the page, as the Home Screen app has no reload button.
// Never in the middle of something: a recording, a send, a name being typed.
// Until then each list poll tries again. The open pane is opened again after the reload.
const VERSION = document.querySelector('meta[name="version"]').content, PANE_KEY = "tmux-phone.pane", FILES_KEY = "tmux-phone.files";
function reloadWhenSafe() {
  if (recorder || unsent || $("mic").disabled || $("attach").disabled || $("paste").disabled || renaming) return;
  if (file && file.changed) return;
  try {
    if (current) sessionStorage.setItem(PANE_KEY, current);
    if (current && !$("files").classList.contains("hidden")) sessionStorage.setItem(FILES_KEY, JSON.stringify({ folder, file: file && file.path }));
  } catch {}
  location.reload();
}

async function openPane(id) {
  const r = await act(`/api/panes/${id}/open`);
  if (!r) return;
  current = id;
  atBottom();
  $("pane-title").textContent = lastTitle[id] || "";
  $("list").classList.add("hidden");
  $("pane").classList.remove("hidden");
  // One terminal connection for the whole visit; tmux switches what it shows.
  if (!socket) startTerminal();
  hideBorderRow(r.border);
  loadPanes();
}

async function showList() {
  stopRecording(true);
  disarm();
  unsent = null;
  setMic(MIC_ICON);
  if (current) await act(`/api/panes/${current}/back`);
  current = null;
  $("pane").classList.add("hidden");
  $("list").classList.remove("hidden");
  loadPanes();
}

$("back").addEventListener("click", showList);

$("close-pane").addEventListener("click", async () => {
  if (!confirm(`Close "${$("pane-title").textContent}"? Anything running in it stops.`)) return;
  if (await act(`/api/panes/${current}/close`)) { current = null; showList(); }
});

document.querySelectorAll("[data-key]").forEach((b) => b.addEventListener("click", () => {
  disarm();
  atBottom();
  act(`/api/panes/${current}/key`, { key: b.dataset.key });
}));

// iOS shows :active, the pressed look, only when the page listens for touches.
document.addEventListener("touchstart", () => {}, { passive: true });

// Keep the keyboard open: a tap on the key bar must not take focus away from the terminal.
// iOS moves focus on the mousedown it fires after the touch. Blocking pointerdown instead would also block the click.
$("keys").addEventListener("mousedown", (e) => e.preventDefault());

// Ctrl and Alt stay on until the next key typed into the terminal, so Ctrl then b is the tmux prefix.
const mods = { ctrl: false, alt: false };

function setMod(name, on) {
  mods[name] = on;
  document.querySelector(`[data-mod="${name}"]`).classList.toggle("armed", on);
}

function disarm() {
  setMod("ctrl", false);
  setMod("alt", false);
}

document.querySelectorAll("[data-mod]").forEach((b) => b.addEventListener("click", () => setMod(b.dataset.mod, !mods[b.dataset.mod])));

// Ctrl turns one typed character into its control code, Alt puts ESC before it. Longer text, like a paste, goes as is.
function withMods(data) {
  let out = data;
  if (data.length === 1) {
    const c = data.charCodeAt(0);
    if (mods.ctrl && c === 32) out = "\x00";
    else if (mods.ctrl && ((c >= 64 && c <= 95) || (c >= 97 && c <= 122))) out = String.fromCharCode(c & 0x1f);
    if (mods.alt) out = "\x1b" + out;
  }
  disarm();
  return out;
}

// A picked photo is pasted into the pane right away as a file path on the Mac, which Claude Code
// turns into an image attachment. Enter submits it.
async function photoBase64(file) {
  // Redrawing on a canvas turns HEIC into JPEG and keeps big photos small; Claude downsizes past ~1600px anyway.
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 2000 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.9));
  return new Promise((r) => {
    const reader = new FileReader();
    reader.onload = () => r(reader.result.split(",")[1]);
    reader.readAsDataURL(blob);
  });
}

async function sendPhotos(blobs, button = $("attach")) {
  const pane = current, images = [], html = button.innerHTML;
  button.disabled = true;
  button.innerHTML = DOTS;
  for (const f of blobs) await photoBase64(f).then((b) => images.push(b), (e) => toast(`Couldn't read ${f.name || "image"}: ${e.message}`));
  if (images.length && pane === current && await act(`/api/panes/${pane}/paste`, { images })) atBottom();
  button.disabled = false;
  button.innerHTML = html;
}

// Photo opens the photo picker.
$("attach").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", () => {
  const files = [...$("file").files];
  $("file").value = "";
  sendPhotos(files);
});
// iOS lets a page read the clipboard only inside the tap, so clipboard.read() runs before any await.
// iOS then shows its own Paste button, which the user taps.
// [paste] pastes an image on the clipboard like a picked photo, or else its text, without Enter.
$("paste").addEventListener("click", async () => {
  const pane = current, button = $("paste");
  let blob, text;
  try {
    const items = await navigator.clipboard.read();
    const image = items.find((i) => i.types.some((t) => t.startsWith("image/")));
    const plain = items.find((i) => i.types.includes("text/plain"));
    if (image) blob = await image.getType(image.types.find((t) => t.startsWith("image/")));
    else if (plain) text = await (await plain.getType("text/plain")).text();
    else return toast("nothing in clipboard");
  } catch (e) {
    return toast(e.message);
  }
  if (blob) return sendPhotos([blob], button);
  button.disabled = true;
  button.innerHTML = DOTS;
  if (await act(`/api/panes/${pane}/paste`, { text })) atBottom();
  button.disabled = false;
  button.innerHTML = "paste";
});

// Tap Mic to record, tap it again to end. The Mac transcribes it and pastes the text into the pane, without Enter.
// A recording that fails to transcribe or paste is kept, and Mic becomes Retry, so nothing said is lost.
let recorder = null, unsent = null, timer = null;
const MIC_ICON = $("mic").innerHTML;
const DOTS = `<span class="dots"><i></i><i></i><i></i></span>`;

function setMic(html, { recording = false, busy = false } = {}) {
  const mic = $("mic");
  mic.innerHTML = html;
  mic.classList.toggle("recording", recording);
  mic.disabled = busy;
}

function stopRecording(discard) {
  if (!recorder) return;
  recorder.discard = discard;
  recorder.stop();
}

async function sendAudio(audio) {
  const pane = current;
  setMic(DOTS, { busy: true });
  try {
    const r = await fetch("/api/transcribe", { method: "POST", headers: { "Content-Type": audio.type }, body: audio });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
    if (pane !== current) return;  // left that pane while it was transcribing
    if (data.text) { await post(`/api/panes/${pane}/paste`, { text: data.text }); atBottom(); }
    unsent = null;
    setMic(MIC_ICON);
    if (!data.text) toast("Didn't catch anything.");
  } catch (e) {
    if (pane !== current) return;
    unsent = audio;
    setMic("retry");
    toast(e.message);
  }
}

$("mic").addEventListener("click", async () => {
  if (recorder) return stopRecording(false);
  if (unsent) return sendAudio(unsent);
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    return toast(`Microphone blocked: ${e.message}`);
  }
  const chunks = [], started = Date.now();
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    clearInterval(timer);
    const { discard, mimeType } = recorder;
    recorder = null;
    if (discard) return setMic(MIC_ICON);
    const type = (mimeType || "audio/mp4").split(";")[0];
    sendAudio(new Blob(chunks, { type }));
  };
  recorder.start();
  const tick = () => {
    const s = Math.floor((Date.now() - started) / 1000);
    setMic(`${MIC_ICON} ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`, { recording: true });
  };
  tick();
  timer = setInterval(tick, 1000);
});

// Our own client for ttyd's websocket (ttyd 1.7.7). The page sends its size as JSON first, then
// "0" + typed bytes and "1" + new size. ttyd sends "0" + output, "1" + title, "2" + its settings.
// Pinch on the terminal sets its font size; it is kept in this browser for next time.
const MIN_FONT = 8, MAX_FONT = 20, FONT_KEY = "tmux-phone.fontSize";
function savedFontSize() {
  try {
    const n = Number(localStorage.getItem(FONT_KEY));
    return n >= MIN_FONT && n <= MAX_FONT ? n : 13;
  } catch { return 13; }
}
const term = new Terminal({ fontSize: savedFontSize(), fontFamily: "Menlo, monospace" });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
const encoder = new TextEncoder();
let socket = null, retryMs = 1000, retryTimer = null;

function startTerminal() {
  term.open($("term"));
  fit.fit();
  term.onData((data) => {
    if (socket.readyState !== WebSocket.OPEN) return;
    atBottom();
    socket.send(encoder.encode("0" + withMods(data)));
  });
  term.onResize(({ cols, rows }) => {
    if (socket.readyState === WebSocket.OPEN) socket.send(encoder.encode("1" + JSON.stringify({ columns: cols, rows })));
  });
  // Fit to the box whenever it changes size, e.g. when the keyboard opens. Skipped while hidden, which reads as 0 wide.
  // Waits 50 ms for the size to settle, as the keyboard slides in over several steps.
  let fitTimer = null;
  new ResizeObserver(() => {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(() => { if ($("term-wrap").clientWidth) fit.fit(); }, 50);
  }).observe($("term-wrap"));
  connect();
}

// Any close reconnects by itself, waiting 1 s, then 2 s, up to 5 s; nothing needs a key press.
function connect() {
  clearTimeout(retryTimer);
  if (socket) { socket.onclose = socket.onmessage = null; socket.close(); }
  const ws = socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/term/ws`, ["tty"]);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    retryMs = 1000;
    term.reset();  // tmux redraws the whole screen on attach
    ws.send(encoder.encode(JSON.stringify({ AuthToken: "", columns: term.cols, rows: term.rows })));
  };
  ws.onmessage = (e) => {
    const data = new Uint8Array(e.data);
    if (data[0] === 48) term.write(data.subarray(1));  // "0" is output; title and settings are not used
  };
  ws.onclose = () => {
    retryTimer = setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 5000);
  };
}

// tmux draws on the terminal's alternate screen, so the browser terminal has nothing of its own to scroll.
// A vertical swipe sends mouse wheel input to tmux instead, as the Mac's wheel does: tmux hands it to the app
// if the app reads the mouse (Claude Code scrolls its own chat), and scrolls the pane's history if not.
// This needs `mouse on` in tmux, which also makes tmux ask for SGR mouse codes. A tap opens the keyboard.
// The text follows the finger: one wheel event per (row height x lines one event scrolls) of finger movement.
// tmux's copy mode scrolls 5 lines per event (its WheelUpPane binding); Claude Code scrolls 1 (measured).
const APP_LINES = 1, COPY_LINES = 5, MAX_WHEEL = 10;
let scrollY = null, scrollPx = 0, swiped = false;
let wheelUps = 0;  // net wheel-up events since the pane was last at the bottom; [↓ bottom] shows while above 0
let pinch = null;  // finger distance and font size when a two-finger pinch began
const fingerGap = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

function setFontSize(size) {
  size = Math.min(MAX_FONT, Math.max(MIN_FONT, size));
  if (size === term.options.fontSize) return;
  term.options.fontSize = size;
  document.body.style.setProperty("--font-size", `${size}px`);  // the file screen's size
  if (file && file.view) file.view.requestMeasure();
  fit.fit();  // the new columns and rows go to ttyd through onResize, and tmux re-fits the window
  hideBorderRow(hiddenRow);  // one row is now a different height
  try { localStorage.setItem(FONT_KEY, String(size)); } catch {}
}

// tmux's pane title row (pane-border-status) is one row above or below the pane. The phone shows one pane, so it
// hides that row: the terminal gets one more row than fits, and that row sits outside #term-wrap, which clips it.
// tmux gets the full row count, so its layout stays right. Wheel rows come from the screen's real box, hidden row included.
let hiddenRow = null;  // "top", "bottom" or null, as the server reports it for the open pane
function hideBorderRow(border) {
  hiddenRow = border || null;
  if (!term.element || !$("term-wrap").clientHeight) return;
  const rowPx = term.element.querySelector(".xterm-screen").getBoundingClientRect().height / term.rows;
  if (!rowPx) return;
  const height = hiddenRow ? `calc(100% + ${rowPx}px)` : "", top = hiddenRow === "top" ? `-${rowPx}px` : "";
  if ($("term").style.height === height && $("term").style.marginTop === top) return;
  Object.assign($("term").style, { height, marginTop: top });
  fit.fit();
}

function atBottom() {
  wheelUps = 0;
  $("to-bottom").classList.add("hidden");
}

function wheelPx() {
  const rowPx = term.element.querySelector(".xterm-screen").getBoundingClientRect().height / term.rows;
  const p = panes.find((p) => p.id === current);
  return rowPx * (p && p.reads_mouse ? APP_LINES : COPY_LINES);
}

function sendWheel(up, count, x, y) {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  wheelUps = Math.max(0, wheelUps + (up ? count : -count));
  $("to-bottom").classList.toggle("hidden", !wheelUps);
  const box = term.element.querySelector(".xterm-screen").getBoundingClientRect();
  const col = Math.min(term.cols, Math.max(1, Math.floor((x - box.left) / (box.width / term.cols)) + 1));
  const row = Math.min(term.rows, Math.max(1, Math.floor((y - box.top) / (box.height / term.rows)) + 1));
  socket.send(encoder.encode("0" + `\x1b[<${up ? 64 : 65};${col};${row}M`.repeat(count)));
}

$("term-wrap").addEventListener("touchstart", (e) => {
  if (e.touches.length > 1) {
    // A second finger turns the touch into a pinch, which never scrolls and never opens the keyboard.
    pinch = { gap: fingerGap(e.touches), size: term.options.fontSize };
    scrollY = null;
    swiped = true;
    return;
  }
  pinch = null;
  scrollY = e.touches[0].clientY;
  scrollPx = 0;
  swiped = false;
}, { passive: true, capture: true });
$("term-wrap").addEventListener("touchmove", (e) => {
  if (pinch) {
    e.preventDefault();
    e.stopPropagation();
    if (e.touches.length > 1) setFontSize(Math.round(pinch.size * fingerGap(e.touches) / pinch.gap));
    return;
  }
  if (scrollY === null || e.touches.length > 1) return;
  e.preventDefault();
  e.stopPropagation();  // the terminal's own touch scrolling has nothing to scroll
  const { clientX: x, clientY: y } = e.touches[0];
  scrollPx += y - scrollY;  // finger moving down shows older lines, like wheel up
  scrollY = y;
  const step = wheelPx(), events = Math.trunc(scrollPx / step);
  if (!events) return;
  swiped = true;
  scrollPx -= events * step;
  sendWheel(events > 0, Math.min(Math.abs(events), MAX_WHEEL), x, y);
}, { passive: false, capture: true });
$("term-wrap").addEventListener("touchend", (e) => {
  if (e.touches.length) return;  // a finger is still down
  pinch = null;
  scrollY = null;
  if (!swiped) term.focus();  // inside the touch, so iOS opens the keyboard
}, { passive: true, capture: true });

// [↓ bottom] sends wheel-down in chunks of 10, 20 more than were sent up, in case the count is off.
// In copy mode tmux leaves it at the bottom; Claude Code ignores the extra.
$("to-bottom").addEventListener("click", async () => {
  const box = term.element.querySelector(".xterm-screen").getBoundingClientRect();
  let left = wheelUps + 20;
  atBottom();
  while (left > 0) {
    sendWheel(false, Math.min(left, 10), box.left + box.width / 2, box.top + box.height / 2);
    left -= 10;
    await new Promise((r) => setTimeout(r, 30));
  }
});

// Only the terminal zooms: stop iOS from zooming the whole page on a pinch.
for (const type of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(type, (e) => e.preventDefault());

// Swipe right on the header goes back to the list; the terminal itself keeps its own touches.
let touchX = null;
$("pane-header").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; });
$("pane-header").addEventListener("touchend", (e) => {
  if (touchX !== null && e.changedTouches[0].clientX - touchX > 80) showList();
  touchX = null;
});

// The file screen, from [files] in the pane view: a folder, or one file from it. It starts in the pane's folder, or
// on the file open in the pane's nvim. A file opens read-only, so it scrolls and selects as plain text; [edit] makes
// it editable, [save] writes it. The save carries the file's mtime from when it was read, and the Mac refuses it
// if the file changed on disk since.
let folder = null;  // path of the folder shown, or of the open file's folder
let file = null;    // the open file: { path, mtime, view, editing, changed }
const editable = new CM.Compartment();
const readOnly = [CM.EditorView.editable.of(false), CM.EditorState.readOnly.of(true)];

async function getJSON(path) {
  const r = await fetch(path);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}

function showFiles() {
  $("pane").classList.add("hidden");
  $("files").classList.remove("hidden");
}

$("files-open").addEventListener("click", async () => {
  let data;
  try { data = await getJSON(`/api/files?pane=${current}`); } catch (e) { return toast(e.message); }
  showFiles();
  if (data.nvim_file) openFile(data.nvim_file, data.nvim_file.replace(/\/[^/]*$/, "") || "/");
  else showFolder(data);
});

async function loadFolder(path) {
  try { showFolder(await getJSON(`/api/files?path=${encodeURIComponent(path)}`)); } catch (e) { toast(e.message); }
}

// One row per entry under a .. row; a folder's name ends in /.
function showFolder(data) {
  closeFile();
  folder = data.path;
  $("files-title").textContent = "‎" + folder;  // a left-to-right mark, or the right-to-left cut moves the first / to the end
  $("files-title").classList.add("path");
  $("folder").classList.remove("hidden");
  const row = (path, label, isFolder) =>
    `<button class="entry${isFolder ? " folder" : ""}" data-path="${esc(path)}" data-folder="${isFolder}">${esc(label)}</button>`;
  const join = (name) => `${folder === "/" ? "" : folder}/${name}`;
  $("folder").innerHTML = row(data.parent, "..", true) +
    data.entries.map((e) => row(join(e.name), e.folder ? `${e.name}/` : e.name, e.folder)).join("");
  $("folder").scrollTop = 0;
}

$("folder").addEventListener("click", (e) => {
  const row = e.target.closest("[data-path]");
  if (!row) return;
  if (row.dataset.folder === "true") loadFolder(row.dataset.path);
  else openFile(row.dataset.path, folder);
});

// A big, binary or non-UTF-8 file comes back as a one-line note instead of its text.
async function openFile(path, from) {
  let data;
  try { data = await getJSON(`/api/file?path=${encodeURIComponent(path)}`); } catch (e) { return toast(e.message); }
  closeFile();
  folder = from;
  file = { path: data.path, mtime: data.mtime, view: null, editing: false, changed: false };
  $("folder").classList.add("hidden");
  $("files-title").classList.remove("path");
  $("files-title").textContent = data.path.split("/").pop();
  if (data.note !== undefined) {
    $("file-note").textContent = data.note;
    $("file-note").classList.remove("hidden");
    return;
  }
  $("file-body").classList.remove("hidden");
  file.view = new CM.EditorView({
    parent: $("file-body"),
    state: CM.EditorState.create({
      doc: data.text,
      extensions: [
        CM.lineNumbers(), CM.EditorView.lineWrapping, CM.history(),
        CM.keymap.of([...CM.defaultKeymap, ...CM.historyKeymap, CM.indentWithTab]),
        CM.syntaxHighlighting(CM.classHighlighter), CM.languageFor(file.path.split("/").pop()),
        CM.EditorState.lineSeparator.of(data.text.includes("\r\n") ? "\r\n" : "\n"),  // keep a Windows file's line ends
        editable.of(readOnly),
        CM.EditorView.updateListener.of((u) => { if (u.docChanged) file.changed = true; }),
      ],
    }),
  });
  setEditing(false);
}

function closeFile() {
  if (file && file.view) file.view.destroy();
  file = null;
  $("file-body").classList.add("hidden");
  $("file-note").classList.add("hidden");
  $("file-edit").classList.add("hidden");
}

function setEditing(on) {
  file.editing = on;
  file.view.dispatch({ effects: editable.reconfigure(on ? [] : readOnly) });
  $("file-edit").textContent = on ? "save" : "edit";
  $("file-edit").classList.toggle("primary", on);
  $("file-edit").classList.remove("hidden");
}

// [edit] puts the cursor on the top line on screen, so the view stays where it is, and focuses it inside the tap,
// so iOS brings up the keyboard. [save] writes the file and goes back to read-only; if the save fails, the
// changes stay on screen.
$("file-edit").addEventListener("click", async () => {
  const saving = file, view = file.view;
  if (!file.editing) {
    setEditing(true);
    view.dispatch({ selection: { anchor: view.lineBlockAtHeight(view.scrollDOM.scrollTop).from } });
    view.focus();
    return;
  }
  $("file-edit").disabled = true;
  try {
    const r = await post("/api/file", { path: saving.path, text: view.state.doc.toString(), mtime: saving.mtime });
    saving.mtime = r.mtime;
    saving.changed = false;
    if (file === saving) { view.contentDOM.blur(); setEditing(false); }
  } catch (e) {
    toast(e.message);
  } finally {
    $("file-edit").disabled = false;
  }
});

// [‹ back] goes from a file to its folder, and from the folder to the pane. Unsaved changes ask first.
$("files-back").addEventListener("click", () => {
  if (!file) {
    $("files").classList.add("hidden");
    $("pane").classList.remove("hidden");
    hideBorderRow(hiddenRow);  // the font size may have changed on the file screen
    return;
  }
  if (file.changed && !confirm(`Leave ${file.path.split("/").pop()} without saving? Your changes are lost.`)) return;
  loadFolder(folder);
});

// Pinch on the file sets the font size, the same one the terminal uses. One finger scrolls the file as usual.
let filePinch = null;
$("file-body").addEventListener("touchstart", (e) => {
  filePinch = e.touches.length === 2 ? { gap: fingerGap(e.touches), size: term.options.fontSize } : null;
}, { passive: true });
$("file-body").addEventListener("touchmove", (e) => {
  if (!filePinch || e.touches.length !== 2) return;
  e.preventDefault();
  setFontSize(Math.round(filePinch.size * fingerGap(e.touches) / filePinch.gap));
}, { passive: false });
$("file-body").addEventListener("touchend", (e) => { if (e.touches.length < 2) filePinch = null; }, { passive: true });

// A theme colors the terminal's 16 colors and the page around it. It is kept in this browser, like the font size.
// Each is: background, foreground, selection, then colors 0-15. Colors are from Ghostty's themes, the Cursor ones
// from Cursor's own theme files, with their see-through colors mixed onto the background.
const THEMES = {
  "monokai": "#272822 #fdfff1 #57584f #272822 #f92672 #a6e22e #e6db74 #fd971f #ae81ff #66d9ef #fdfff1 #6e7066 #f92672 #a6e22e #e6db74 #fd971f #ae81ff #66d9ef #fdfff1",
  "gruvbox-dark-hard": "#1d2021 #ebdbb2 #665c54 #1d2021 #cc241d #98971a #d79921 #458588 #b16286 #689d6a #a89984 #928374 #fb4934 #b8bb26 #fabd2f #83a598 #d3869b #8ec07c #ebdbb2",
  "gruvbox-dark": "#282828 #ebdbb2 #665c54 #282828 #cc241d #98971a #d79921 #458588 #b16286 #689d6a #a89984 #928374 #fb4934 #b8bb26 #fabd2f #83a598 #d3869b #8ec07c #ebdbb2",
  "cursor-dark": "#141414 #f0f0f0 #2e2e2e #242424 #fc6b83 #3fa266 #d2943e #81a1c1 #b48ead #88c0d0 #f0f0f0 #989898 #fc6b83 #70b489 #f1b467 #87a6c4 #b48ead #88c0d0 #ffffff",
  "cursor-dark-midnight": "#191c22 #d8dee9 #272c36 #272c36 #bf616a #a3be8c #ebcb8b #81a1c1 #7d7c9b #88c0d0 #e5e9f0 #4c566a #bf616a #a3be8c #ebcb8b #81a1c1 #b48ead #8fbcbb #eceff4",
  "cursor-dark-high-contrast": "#0a0a0a #f0f0f0 #1c1c1c #2a2a2a #bf616a #a3be8c #ebcb8b #81a1c1 #b48ead #88c0d0 #f0f0f0 #989898 #bf616a #a3be8c #ebcb8b #81a1c1 #b48ead #88c0d0 #ffffff",
  "cursor-light": "#f3f3f3 #141414 #d4d4d4 #141414 #be1744 #007041 #8b5700 #0064b0 #92156a #176c74 #fcfcfc #4e4e4e #ce405b #00854c #a46700 #2778c1 #b54e90 #3b7e84 #ffffff",
  "dracula": "#282a36 #f8f8f2 #44475a #21222c #ff5555 #50fa7b #f1fa8c #bd93f9 #ff79c6 #8be9fd #f8f8f2 #6272a4 #ff6e6e #69ff94 #ffffa5 #d6acff #ff92df #a4ffff #ffffff",
  "catppuccin-mocha": "#1e1e2e #cdd6f4 #585b70 #45475a #f38ba8 #a6e3a1 #f9e2af #89b4fa #f5c2e7 #94e2d5 #a6adc8 #585b70 #f37799 #89d88b #ebd391 #74a8fc #f2aede #6bd7ca #bac2de",
  "tokyo-night": "#1a1b26 #c0caf5 #33467c #15161e #f7768e #9ece6a #e0af68 #7aa2f7 #bb9af7 #7dcfff #a9b1d6 #414868 #f7768e #9ece6a #e0af68 #7aa2f7 #bb9af7 #7dcfff #c0caf5",
  "nord": "#2e3440 #d8dee9 #434c5e #3b4252 #bf616a #a3be8c #ebcb8b #81a1c1 #b48ead #88c0d0 #e5e9f0 #596377 #bf616a #a3be8c #ebcb8b #81a1c1 #b48ead #8fbcbb #eceff4",
  "one-dark": "#21252b #abb2bf #323844 #21252b #e06c75 #98c379 #e5c07b #61afef #c678dd #56b6c2 #abb2bf #767676 #e06c75 #98c379 #e5c07b #61afef #c678dd #56b6c2 #abb2bf",
  "solarized-dark": "#002b36 #839496 #073642 #073642 #dc322f #859900 #b58900 #268bd2 #d33682 #2aa198 #eee8d5 #335e69 #cb4b16 #586e75 #657b83 #839496 #6c71c4 #93a1a1 #fdf6e3",
  "xterm": "#000000 #d0d0d0 #303030 #000000 #cd3131 #0dbc79 #e5e510 #2472c8 #bc3fbc #11a8cd #e5e5e5 #666666 #f14c4c #23d18b #f5f543 #3b8eea #d670d6 #29b8db #e5e5e5",
};
const THEME_KEY = "tmux-phone.theme", ANSI = ["black", "red", "green", "yellow", "blue", "magenta", "cyan", "white"];
let theme = "monokai";
try { if (THEMES[localStorage.getItem(THEME_KEY)]) theme = localStorage.getItem(THEME_KEY); } catch {}

// The page's colors come from the theme's: dim is its gray (color 8), lines its selection, and the accents its
// plain colors 1-6, as some themes, like Solarized, make the bright ones grays.
function setTheme(name) {
  theme = name;
  const [bg, fg, selection, ...c] = THEMES[name].split(" ");
  const vars = { bg, fg, dim: c[8], line: selection, red: c[1], green: c[2], yellow: c[3], blue: c[4], magenta: c[5], cyan: c[6] };
  for (const [k, v] of Object.entries(vars)) document.documentElement.style.setProperty(`--${k}`, v);
  document.querySelector('meta[name="theme-color"]').content = bg;
  const colors = Object.fromEntries(c.map((v, i) => [i < 8 ? ANSI[i] : "bright" + ANSI[i - 8][0].toUpperCase() + ANSI[i - 8].slice(1), v]));
  term.options.theme = { background: bg, foreground: fg, cursor: fg, cursorAccent: bg, selectionBackground: selection, ...colors };
  try { localStorage.setItem(THEME_KEY, name); } catch {}
}

// [theme] in the list opens the theme screen. A tap on a theme sets it at once; [‹ back] goes back to the list.
function renderThemes() {
  $("theme-list").innerHTML = Object.entries(THEMES).map(([name, colors]) => {
    const [bg, fg, , ...c] = colors.split(" ");
    const swatches = c.slice(1, 7).map((v) => `<span style="color:${v}">██</span>`).join("");
    return `<button class="theme-row${name === theme ? " current" : ""}" data-theme="${name}" style="background:${bg};color:${fg}">` +
      `<span class="name">${name}</span><span>${swatches}</span></button>`;
  }).join("");
}

$("theme-open").addEventListener("click", () => {
  renderThemes();
  $("list").classList.add("hidden");
  $("themes").classList.remove("hidden");
});
$("theme-list").addEventListener("click", (e) => {
  const row = e.target.closest("[data-theme]");
  if (!row) return;
  setTheme(row.dataset.theme);
  renderThemes();
});
$("themes-back").addEventListener("click", () => {
  $("themes").classList.add("hidden");
  $("list").classList.remove("hidden");
});
setTheme(theme);

// iOS drops the connection while the app is in the background; reconnect at once on return.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && socket && socket.readyState !== WebSocket.OPEN) connect();
});

// The poll also runs in the pane view, to see a new version.
setInterval(() => { if (!document.hidden) loadPanes(true); }, 3000);
loadPanes();
document.body.style.setProperty("--font-size", `${term.options.fontSize}px`);
let reopen = null, reopenFiles = null;
try {
  reopen = sessionStorage.getItem(PANE_KEY);
  reopenFiles = JSON.parse(sessionStorage.getItem(FILES_KEY));
  sessionStorage.removeItem(PANE_KEY);
  sessionStorage.removeItem(FILES_KEY);
} catch {}
// After a reload, the pane opens again, then the folder or file that was on the file screen.
if (reopen) openPane(reopen).then(() => {
  if (!reopenFiles || current !== reopen) return;
  showFiles();
  if (reopenFiles.file) openFile(reopenFiles.file, reopenFiles.folder);
  else loadFolder(reopenFiles.folder);
});
</script>
